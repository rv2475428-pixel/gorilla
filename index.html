<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ready?</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        body {
            font-family: Arial, sans-serif;
        }

        .scene {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
        }

        /* =========================
           MAIN IMAGE
        ========================= */

        .image {
            position: absolute;
            inset: -5%;

            width: 110%;
            height: 110%;

            object-fit: cover;
            object-position: center;

            opacity: 0;
            transform: scale(1.04);

            filter: brightness(0.75);

            transition:
                opacity 0.8s ease,
                filter 0.8s ease;
        }

        .image.visible {
            opacity: 1;
            filter: brightness(1);
        }

        /* =========================
           RGB GLITCH
        ========================= */

        .rgb {
            position: absolute;
            inset: -5%;

            width: 110%;
            height: 110%;

            background-image: url("image.jpeg");
            background-size: cover;
            background-position: center;

            pointer-events: none;

            opacity: 0;
            mix-blend-mode: screen;

            transition: opacity 0.1s linear;
        }

        .rgb.red {
            filter:
                sepia(1)
                saturate(8)
                hue-rotate(-25deg);
        }

        .rgb.blue {
            filter:
                sepia(1)
                saturate(8)
                hue-rotate(170deg);
        }

        /* =========================
           DISCO LIGHTS
        ========================= */

        .disco {
            position: absolute;
            inset: -20%;

            pointer-events: none;

            opacity: 0;

            background:
                radial-gradient(
                    circle at 20% 30%,
                    rgba(255, 0, 80, 0.65),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 20%,
                    rgba(0, 255, 255, 0.6),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 70% 80%,
                    rgba(255, 0, 255, 0.6),
                    transparent 40%
                ),
                radial-gradient(
                    circle at 20% 80%,
                    rgba(0, 255, 100, 0.5),
                    transparent 40%
                );

            mix-blend-mode: screen;

            filter: blur(50px);
        }

        /* =========================
           LIGHT RAYS
        ========================= */

        .rays {
            position: absolute;
            inset: -50%;

            pointer-events: none;

            opacity: 0;

            background:
                repeating-conic-gradient(
                    from 0deg,
                    rgba(255, 0, 0, 0.13) 0deg 7deg,
                    transparent 7deg 16deg,
                    rgba(0, 255, 255, 0.12) 16deg 23deg,
                    transparent 23deg 32deg
                );

            mix-blend-mode: screen;

            filter: blur(12px);

            animation: rotateRays 8s linear infinite;
        }

        @keyframes rotateRays {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        /* =========================
           FLASH
        ========================= */

        .flash {
            position: absolute;
            inset: 0;

            pointer-events: none;

            background: #fff;

            opacity: 0;

            mix-blend-mode: screen;
        }

        /* =========================
           START SCREEN
        ========================= */

        .start-screen {
            position: absolute;
            inset: 0;

            display: flex;
            justify-content: center;
            align-items: center;

            z-index: 20;

            background:
                radial-gradient(
                    circle,
                    rgba(255,255,255,0.08),
                    rgba(0,0,0,0.95)
                );

            transition:
                opacity 0.5s ease,
                visibility 0.5s ease;
        }

        .start-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .start-button {
            appearance: none;
            border: none;

            padding: 18px 55px;

            font-size: 26px;
            font-weight: bold;

            color: #fff;

            background: rgba(255,255,255,0.08);

            border: 2px solid rgba(255,255,255,0.7);

            border-radius: 12px;

            cursor: pointer;

            backdrop-filter: blur(10px);

            box-shadow:
                0 0 25px rgba(255,255,255,0.15);

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
        }

        .start-button:hover {
            transform: scale(1.06);

            background: rgba(255,255,255,0.16);

            box-shadow:
                0 0 40px rgba(255,255,255,0.3);
        }

        .start-button:active {
            transform: scale(0.96);
        }

        /* =========================
           READY TEXT
        ========================= */

        .ready {
            position: absolute;
            inset: 0;

            z-index: 15;

            display: flex;
            justify-content: center;
            align-items: center;

            pointer-events: none;

            color: #fff;

            font-size: clamp(50px, 10vw, 120px);

            font-weight: 900;

            opacity: 0;

            text-shadow:
                0 0 15px rgba(255,255,255,0.8),
                0 0 40px rgba(255,0,255,0.4);
        }

        .ready.show {
            animation: readyAnimation 1s ease forwards;
        }

        @keyframes readyAnimation {
            0% {
                opacity: 0;
                transform: scale(0.7);
            }

            30% {
                opacity: 1;
                transform: scale(1.05);
            }

            70% {
                opacity: 1;
                transform: scale(1);
            }

            100% {
                opacity: 0;
                transform: scale(1.15);
            }
        }

        /* =========================
           COUNTDOWN
        ========================= */

        .countdown {
            position: absolute;
            inset: 0;

            z-index: 16;

            display: flex;
            justify-content: center;
            align-items: center;

            pointer-events: none;

            color: #fff;

            font-size: clamp(100px, 20vw, 220px);

            font-weight: 900;

            opacity: 0;

            text-shadow:
                0 0 20px rgba(255,255,255,0.9),
                0 0 60px rgba(255,0,255,0.5);
        }

        .countdown.show {
            animation: countdownPop 0.9s ease forwards;
        }

        @keyframes countdownPop {
            0% {
                opacity: 0;
                transform: scale(0.4);
            }

            30% {
                opacity: 1;
                transform: scale(1.1);
            }

            70% {
                opacity: 1;
                transform: scale(1);
            }

            100% {
                opacity: 0;
                transform: scale(1.2);
            }
        }
    </style>
</head>

<body>

<div class="scene">

    <!-- MAIN IMAGE -->
    <img
        id="mainImage"
        class="image"
        src="image.jpeg"
        alt=""
    >

    <!-- RGB EFFECTS -->
    <div id="rgbRed" class="rgb red"></div>
    <div id="rgbBlue" class="rgb blue"></div>

    <!-- DISCO -->
    <div id="disco" class="disco"></div>

    <!-- LIGHT RAYS -->
    <div id="rays" class="rays"></div>

    <!-- FLASH -->
    <div id="flash" class="flash"></div>

    <!-- START SCREEN -->
    <div id="startScreen" class="start-screen">

        <button
            id="startButton"
            class="start-button"
        >
            شروع
        </button>

    </div>

    <!-- READY -->
    <div id="ready" class="ready">
        آماده‌ای؟
    </div>

    <!-- COUNTDOWN -->
    <div id="countdown" class="countdown"></div>

    <!-- MUSIC -->
    <audio
        id="music"
        preload="auto"
        loop
    >
        <source
            src="FART%20PHONK.mp3"
            type="audio/mpeg"
        >
    </audio>

</div>


<script>

    const image = document.getElementById("mainImage");

    const music = document.getElementById("music");

    const startScreen = document.getElementById("startScreen");

    const startButton = document.getElementById("startButton");

    const ready = document.getElementById("ready");

    const countdown = document.getElementById("countdown");

    const disco = document.getElementById("disco");

    const rays = document.getElementById("rays");

    const rgbRed = document.getElementById("rgbRed");

    const rgbBlue = document.getElementById("rgbBlue");

    const flash = document.getElementById("flash");


    let audioContext;

    let analyser;

    let source;

    let frequencyData;

    let lastStrongBeat = 0;


    function wait(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }


    /* =========================
       COUNTDOWN
    ========================= */

    async function showCountdownNumber(number) {

        countdown.textContent = number;

        countdown.classList.remove("show");

        void countdown.offsetWidth;

        countdown.classList.add("show");

        await wait(1000);
    }


    /* =========================
       START SEQUENCE
    ========================= */

    async function startSequence() {

        startButton.disabled = true;

        startScreen.classList.add("hidden");

        await wait(400);


        /* آماده‌ای؟ */

        ready.classList.remove("show");

        void ready.offsetWidth;

        ready.classList.add("show");

        await wait(1000);


        /* شمارش */

        await showCountdownNumber(3);

        await showCountdownNumber(2);

        await showCountdownNumber(1);


        /* عکس ظاهر شود */

        image.classList.add("visible");


        /* موزیک */

        await startMusic();


        /* افکت‌ها */

        setupVisualizer();
    }


    /* =========================
       MUSIC
    ========================= */

    async function startMusic() {

        try {

            await music.play();

        } catch (error) {

            console.log(
                "Music could not start:",
                error
            );

        }

    }


    /* =========================
       AUDIO VISUALIZER
    ========================= */

    function setupVisualizer() {

        if (audioContext) {
            return;
        }


        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();


        analyser =
            audioContext.createAnalyser();


        analyser.fftSize = 512;

        analyser.smoothingTimeConstant = 0.82;


        frequencyData =
            new Uint8Array(
                analyser.frequencyBinCount
            );


        source =
            audioContext.createMediaElementSource(
                music
            );


        source.connect(analyser);

        analyser.connect(
            audioContext.destination
        );


        animate();
    }


    /* =========================
       BASS
    ========================= */

    function getBass() {

        let total = 0;

        let count = 0;


        /*
         * فقط فرکانس‌های پایین
         */

        for (
            let i = 1;
            i < 18;
            i++
        ) {

            total += frequencyData[i];

            count++;
        }


        return count
            ? total / count
            : 0;
    }


    /* =========================
       MID
    ========================= */

    function getMid() {

        let total = 0;

        let count = 0;


        for (
            let i = 18;
            i < 80;
            i++
        ) {

            total += frequencyData[i];

            count++;
        }


        return count
            ? total / count
            : 0;
    }


    /* =========================
       ANIMATION
    ========================= */

    function animate() {

        requestAnimationFrame(animate);


        analyser.getByteFrequencyData(
            frequencyData
        );


        const bass = getBass();

        const mid = getMid();


        /*
         * حساسیت بیس کمتر شده.
         *
         * زیر 55 تقریباً نادیده گرفته می‌شود.
         *
         * سقف واکنش هم 0.55 است.
         */

        const beat =
            Math.min(
                Math.max(
                    (bass - 55) / 170,
                    0
                ),
                0.55
            );


        const middle =
            Math.min(
                Math.max(
                    (mid - 40) / 160,
                    0
                ),
                0.7
            );


        /* =========================
           IMAGE ZOOM
        ========================= */

        const zoom =
            1.02 +
            beat * 0.025;


        image.style.transform =
            `scale(${zoom})`;


        /* =========================
           DISCO
        ========================= */

        disco.style.opacity =
            0.10 +
            beat * 0.30;


        disco.style.transform =
            `
            scale(${1 + beat * 0.15})
            rotate(${performance.now() * 0.015}deg)
            `;


        disco.style.filter =
            `
            blur(${50 - beat * 10}px)
            `;


        /* =========================
           RAYS
        ========================= */

        rays.style.opacity =
            0.08 +
            middle * 0.28;


        rays.style.transform =
            `
            scale(${1 + beat * 0.08})
            `;


        /* =========================
           RGB
        ========================= */

        const rgbAmount =
            beat * 5;


        rgbRed.style.transform =
            `translateX(${-rgbAmount}px)`;


        rgbBlue.style.transform =
            `translateX(${rgbAmount}px)`;


        rgbRed.style.opacity =
            beat * 0.18;


        rgbBlue.style.opacity =
            beat * 0.18;


        /* =========================
           FLASH
        ========================= */

        const now =
            performance.now();


        if (
            beat > 0.48 &&
            now - lastStrongBeat > 180
        ) {

            lastStrongBeat = now;

            flash.style.opacity =
                Math.min(
                    (beat - 0.48) * 0.8,
                    0.15
                );

        } else {

            flash.style.opacity =
                Math.max(
                    0,
                    parseFloat(
                        flash.style.opacity || 0
                    ) - 0.025
                );
        }

    }


    /* =========================
       BUTTON
    ========================= */

    startButton.addEventListener(
        "click",
        async () => {

            await startSequence();

        }
    );

</script>

</body>
</html>
