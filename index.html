<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>FART PHONK</title>

<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
    }

    body {
        position: relative;
        cursor: default;
        user-select: none;
    }


    /* =====================================
       GORILLA IMAGE
    ===================================== */

    .scene {
        position: fixed;
        inset: 0;

        overflow: hidden;

        background: #000;
    }

    .image {
        position: absolute;

        inset: -5%;

        width: 110%;
        height: 110%;

        object-fit: cover;
        object-position: center;

        display: block;

        opacity: 0;

        transform:
            scale(1.08);

        filter:
            brightness(0.7);

        transition:
            opacity 0.8s ease,
            filter 0.8s ease;

        will-change:
            transform,
            filter;
    }

    .image.visible {
        opacity: 1;

        filter:
            brightness(1);
    }


    /* =====================================
       RGB GLITCH
    ===================================== */

    .rgb {
        position: absolute;

        inset: -5%;

        width: 110%;
        height: 110%;

        background-image:
            url("image.jpeg");

        background-size: cover;
        background-position: center;

        opacity: 0;

        pointer-events: none;

        mix-blend-mode: screen;

        will-change:
            transform,
            opacity;
    }

    .rgb.red {
        filter:
            sepia(1)
            saturate(8)
            hue-rotate(-35deg);
    }

    .rgb.blue {
        filter:
            sepia(1)
            saturate(8)
            hue-rotate(150deg);
    }


    /* =====================================
       DISCO LIGHT
    ===================================== */

    .disco {
        position: absolute;

        inset: -30%;

        pointer-events: none;

        opacity: 0;

        mix-blend-mode: screen;

        background:

            radial-gradient(
                circle at 15% 20%,
                rgba(255, 0, 0, 0.9),
                transparent 20%
            ),

            radial-gradient(
                circle at 85% 15%,
                rgba(0, 255, 255, 0.9),
                transparent 20%
            ),

            radial-gradient(
                circle at 80% 80%,
                rgba(255, 0, 255, 0.9),
                transparent 20%
            ),

            radial-gradient(
                circle at 15% 85%,
                rgba(0, 255, 100, 0.9),
                transparent 20%
            );

        filter:
            blur(45px);

        will-change:
            transform,
            opacity,
            filter;
    }


    /* =====================================
       DISCO RAYS
    ===================================== */

    .rays {
        position: absolute;

        inset: -50%;

        pointer-events: none;

        opacity: 0;

        mix-blend-mode: screen;

        background:

            repeating-conic-gradient(
                from 0deg,

                rgba(255, 0, 0, 0.35)
                0deg 8deg,

                rgba(0, 255, 255, 0.35)
                8deg 16deg,

                rgba(255, 0, 255, 0.35)
                16deg 24deg,

                transparent
                24deg 35deg
            );

        filter:
            blur(12px);

        animation:
            rotateRays 8s linear infinite;

        will-change:
            transform,
            opacity;
    }


    @keyframes rotateRays {

        from {
            transform:
                rotate(0deg);
        }

        to {
            transform:
                rotate(360deg);
        }

    }


    /* =====================================
       FLASH
    ===================================== */

    .flash {
        position: fixed;

        inset: 0;

        background: #fff;

        opacity: 0;

        pointer-events: none;

        z-index: 10;

        mix-blend-mode: screen;
    }


    /* =====================================
       COUNTDOWN
    ===================================== */

    .countdown {

        position: fixed;

        inset: 0;

        display: flex;

        align-items: center;
        justify-content: center;

        z-index: 30;

        color: #fff;

        font-family:
            Arial,
            sans-serif;

        font-size: 120px;

        font-weight: 900;

        opacity: 0;

        pointer-events: none;

        text-shadow:

            0 0 20px
            rgba(255,255,255,0.9),

            0 0 50px
            rgba(255,0,255,0.8),

            0 0 100px
            rgba(0,255,255,0.7);

    }


    .countdown.show {

        opacity: 1;

        animation:
            countdownPop
            0.9s ease-out
            forwards;

    }


    @keyframes countdownPop {

        0% {

            transform:
                scale(1.8)
                rotate(-5deg);

            opacity: 0;

        }

        30% {

            opacity: 1;

        }

        70% {

            transform:
                scale(1)
                rotate(0deg);

            opacity: 1;

        }

        100% {

            transform:
                scale(0.7);

            opacity: 0;

        }

    }


    /* =====================================
       MOBILE
    ===================================== */

    @media (max-width: 600px) {

        .countdown {

            font-size: 90px;

        }

        .disco {

            filter:
                blur(30px);

        }

        .rays {

            opacity: 0;

        }

    }

</style>


</head>

<body>


<!-- =====================================
     IMAGE
====================================== -->

<div class="scene">

    <img
        class="image"
        id="image"
        src="image.jpeg"
        alt=""
    >


    <div
        class="rgb red"
        id="rgbRed">
    </div>


    <div
        class="rgb blue"
        id="rgbBlue">
    </div>


    <div
        class="disco"
        id="disco">
    </div>


    <div
        class="rays"
        id="rays">
    </div>

</div>


<!-- =====================================
     FLASH
====================================== -->

<div
    class="flash"
    id="flash">
</div>


<!-- =====================================
     COUNTDOWN
====================================== -->

<div
    class="countdown"
    id="countdown">
</div>


<!-- =====================================
     MUSIC
====================================== -->

<audio
    id="music"
    preload="auto"
    loop>

    <source
        src="FART%20PHONK.mp3"
        type="audio/mpeg">

</audio>


<script>

    const image =
        document.getElementById(
            "image"
        );

    const countdown =
        document.getElementById(
            "countdown"
        );

    const music =
        document.getElementById(
            "music"
        );

    const disco =
        document.getElementById(
            "disco"
        );

    const rays =
        document.getElementById(
            "rays"
        );

    const flash =
        document.getElementById(
            "flash"
        );

    const rgbRed =
        document.getElementById(
            "rgbRed"
        );

    const rgbBlue =
        document.getElementById(
            "rgbBlue"
        );


    let audioContext = null;

    let analyser = null;

    let source = null;

    let frequencyData = null;

    let lastStrongBeat = 0;


    /* =====================================
       PAGE LOAD
    ====================================== */

    window.addEventListener(
        "load",
        startSequence
    );


    async function startSequence() {

        /*
         * جلوگیری از نمایش عکس
         */

        image.classList.remove(
            "visible"
        );


        /*
         * Countdown
         */

        await showNumber("3");

        await wait(1000);


        await showNumber("2");

        await wait(1000);


        await showNumber("1");

        await wait(1000);


        /*
         * نمایش گوریل
         */

        image.classList.add(
            "visible"
        );


        /*
         * شروع موزیک
         */

        await startMusic();

    }


    /* =====================================
       COUNTDOWN
    ====================================== */

    function showNumber(number) {

        return new Promise(
            resolve => {

                countdown.textContent =
                    number;

                countdown.classList.remove(
                    "show"
                );


                /*
                 * Force reflow
                 */

                void countdown.offsetWidth;


                countdown.classList.add(
                    "show"
                );


                setTimeout(
                    resolve,
                    1000
                );

            }
        );

    }


    /* =====================================
       WAIT
    ====================================== */

    function wait(ms) {

        return new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    ms
                )
        );

    }


    /* =====================================
       START MUSIC
    ====================================== */

    async function startMusic() {

        try {

            /*
             * تلاش برای پخش خودکار
             */

            await music.play();

        }

        catch (error) {

            console.log(
                "Autoplay blocked."
            );

            /*
             * اگر مرورگر اجازه نداد،
             * با اولین کلیک کاربر شروع می‌شود.
             */

            document.addEventListener(
                "click",
                startMusicAfterClick,
                {
                    once: true
                }
            );

            return;

        }


        setupVisualizer();

    }


    /* =====================================
       FALLBACK CLICK
    ====================================== */

    async function startMusicAfterClick() {

        try {

            await music.play();

            setupVisualizer();

        }

        catch (error) {

            console.error(
                error
            );

        }

    }


    /* =====================================
       AUDIO ANALYZER
    ====================================== */

    function setupVisualizer() {

        if (analyser) {
            return;
        }


        try {

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();


            analyser =
                audioContext.createAnalyser();


            analyser.fftSize =
                512;


            analyser.smoothingTimeConstant =
                0.72;


            frequencyData =
                new Uint8Array(
                    analyser.frequencyBinCount
                );


            source =
                audioContext.createMediaElementSource(
                    music
                );


            source.connect(
                analyser
            );


            analyser.connect(
                audioContext.destination
            );


            /*
             * فعال کردن افکت‌ها
             */

            disco.style.opacity =
                "0.35";


            rays.style.opacity =
                "0.2";


            animate();


        }

        catch (error) {

            console.error(
                "Visualizer error:",
                error
            );

        }

    }


    /* =====================================
       BASS
    ====================================== */

    function getBass() {

        let bass = 0;


        for (
            let i = 1;
            i < 18;
            i++
        ) {

            bass +=
                frequencyData[i];

        }


        return bass / 17;

    }


    /* =====================================
       MID
    ====================================== */

    function getMid() {

        let mid = 0;


        for (
            let i = 18;
            i < 80;
            i++
        ) {

            mid +=
                frequencyData[i];

        }


        return mid / 62;

    }


    /* =====================================
       ANIMATION
    ====================================== */

    function animate() {

        requestAnimationFrame(
            animate
        );


        if (!analyser) {
            return;
        }


        analyser.getByteFrequencyData(
            frequencyData
        );


        const bass =
            getBass();


        const mid =
            getMid();


        const beat =
            Math.min(
                bass / 150,
                1
            );


        const middle =
            Math.min(
                mid / 150,
                1
            );


        /* =================================
           IMAGE ZOOM
        ================================= */

        const zoom =
            1.02 +
            beat * 0.075;


        image.style.transform =
            `scale(${zoom})`;


        /* =================================
           DISCO LIGHT
        ================================= */

        disco.style.opacity =
            0.25 +
            beat * 0.75;


        disco.style.transform =

            `
            scale(${1 + beat * 0.35})
            rotate(
                ${performance.now() * 0.015}deg
            )
            `;


        disco.style.filter =
            `blur(${45 - beat * 20}px)`;


        /* =================================
           RAYS
        ================================= */

        rays.style.opacity =
            0.15 +
            middle * 0.5;


        rays.style.transform =
            `scale(${1 + beat * 0.2})`;


        /* =================================
           RGB GLITCH
        ================================= */

        const rgbAmount =
            beat * 22;


        rgbRed.style.transform =
            `translateX(${-rgbAmount}px)`;


        rgbBlue.style.transform =
            `translateX(${rgbAmount}px)`;


        rgbRed.style.opacity =
            beat * 0.35;


        rgbBlue.style.opacity =
            beat * 0.35;


        /* =================================
           STRONG BEAT FLASH
        ================================= */

        const now =
            performance.now();


        if (
            beat > 0.82 &&
            now - lastStrongBeat > 100
        ) {

            lastStrongBeat =
                now;


            flash.style.opacity =
                Math.min(
                    (beat - 0.82) * 1.8,
                    0.35
                );

        }

        else {

            flash.style.opacity =
                Math.max(
                    0,

                    parseFloat(
                        flash.style.opacity || 0
                    ) - 0.04
                );

        }

    }

</script>


</body>
</html>
